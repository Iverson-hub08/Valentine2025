<script>
    document.addEventListener("DOMContentLoaded", function () {
        const noButton = document.getElementById("no-button");
        let buttonSize = 27; // Initial font size
        let buttonWidth = 230; // Initial width
        let buttonHeight = 50; // Initial height

        // Prevent clicking
        noButton.addEventListener("click", function (event) {
            event.preventDefault(); // Stops the button from working
        });

        // Move & Shrink the button when hovered
        noButton.addEventListener("mouseover", function () {
            const screenWidth = window.innerWidth - noButton.clientWidth;
            const screenHeight = window.innerHeight - noButton.clientHeight;

            const newX = Math.random() * screenWidth;
            const newY = Math.random() * screenHeight;

            noButton.style.position = "absolute";
            noButton.style.left = `${newX}px`;
            noButton.style.top = `${newY}px`;

            // Reduce button size (and make it disappear when too small)
            if (buttonSize > 5 && buttonWidth > 50 && buttonHeight > 20) { 
                buttonSize -= 2;
                buttonWidth -= 15;  
                buttonHeight -= 5;   

                noButton.style.fontSize = `${buttonSize}px`;
                noButton.style.width = `${buttonWidth}px`;
                noButton.style.height = `${buttonHeight}px`;
                noButton.style.padding = `${buttonSize / 2}px ${buttonSize}px`;
            } else {
                noButton.style.display = "none"; // Make it disappear when too small
            }
        });
    });
</script>
